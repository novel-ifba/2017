; O PHP nao define um save_path na imagem oficial; sem isto a sessao nunca e gravada.
session.save_path = "/var/lib/php/sessions"

; O CI 3.1.0 valida o id de sessao com /^[0-9a-f]{40}$/
; (system/libraries/Session/Session.php), tamanho do SHA-1 que o PHP <= 7.0 usava.
; No PHP 7.1+ o id passou a ter 32 caracteres, entao o framework descartava o
; cookie e criava uma sessao nova a cada request - o login nunca se mantinha.
; Voltar o id para 40 caracteres hexadecimais satisfaz a validacao sem
; precisar alterar o framework.
session.sid_length = 40
session.sid_bits_per_character = 4
